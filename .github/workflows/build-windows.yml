name: Build Windows EXE (Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'scripts/**'
      - 'package.json'
      - 'src-tauri/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Windows EXE
        run: npm run tauri:build

      - name: Upload standalone singularis.exe & NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: SINGULARIS-Windows-x64
          path: |
            src-tauri/target/release/singularis.exe
            src-tauri/target/release/bundle/nsis/*.exe
